# BlackWave-Pro - Render Deployment Configuration
# Clean architecture with Epoxy transport

services:
  - type: web
    name: blackwave-pro
    env: node
    plan: free
    branch: main
    healthCheckPath: /
    buildCommand: "npm install && npm run build"
    startCommand: "node server/index.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
